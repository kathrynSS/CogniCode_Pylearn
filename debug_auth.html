<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .btn { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>认证调试页面</h1>
    
    <div class="debug-section">
        <h2>步骤 1: 模拟登录设置localStorage</h2>
        <button class="btn" onclick="simulateLogin()">设置登录状态</button>
        <button class="btn" onclick="clearStorage()">清除存储</button>
        <div id="step1-result"></div>
    </div>
    
    <div class="debug-section">
        <h2>步骤 2: 检查localStorage</h2>
        <button class="btn" onclick="checkStorage()">检查存储状态</button>
        <div id="step2-result"></div>
    </div>
    
    <div class="debug-section">
        <h2>步骤 3: 测试跳转到graph.html</h2>
        <p>先执行步骤1设置登录状态，然后点击下面的按钮</p>
        <a href="graph.html" class="btn">跳转到Graph页面</a>
    </div>
    
    <div class="debug-section">
        <h2>当前localStorage内容</h2>
        <pre id="storage-dump"></pre>
        <button class="btn" onclick="dumpStorage()">刷新存储内容</button>
    </div>

    <script>
        function simulateLogin() {
            console.log('模拟登录...');
            
            const userData = {
                id: 1,
                username: 'testuser',
                email: 'test@example.com',
                name: 'Test User'
            };
            
            try {
                localStorage.setItem('userData', JSON.stringify(userData));
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userToken', 'test_token_' + Date.now());
                
                document.getElementById('step1-result').innerHTML = 
                    '<p class="success">✅ 登录状态已设置！</p>';
                dumpStorage();
            } catch (error) {
                document.getElementById('step1-result').innerHTML = 
                    '<p class="error">❌ 设置失败: ' + error.message + '</p>';
            }
        }
        
        function clearStorage() {
            localStorage.removeItem('userData');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userToken');
            
            document.getElementById('step1-result').innerHTML = 
                '<p class="success">🗑️ 存储已清除</p>';
            dumpStorage();
        }
        
        function checkStorage() {
            const userData = localStorage.getItem('userData');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userToken = localStorage.getItem('userToken');
            
            let result = '<h3>存储检查结果:</h3>';
            result += '<p>userData: ' + (userData ? '✅ 存在' : '❌ 不存在') + '</p>';
            result += '<p>isLoggedIn: ' + (isLoggedIn ? '✅ true' : '❌ false') + '</p>';
            result += '<p>userToken: ' + (userToken ? '✅ 存在' : '❌ 不存在') + '</p>';
            
            if (isLoggedIn && userData) {
                try {
                    const user = JSON.parse(userData);
                    result += '<p class="success">✅ 登录状态有效，用户: ' + user.username + '</p>';
                } catch (e) {
                    result += '<p class="error">❌ userData格式无效: ' + e.message + '</p>';
                }
            } else {
                result += '<p class="error">❌ 未登录状态</p>';
            }
            
            document.getElementById('step2-result').innerHTML = result;
        }
        
        function dumpStorage() {
            const storage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                storage[key] = localStorage.getItem(key);
            }
            
            document.getElementById('storage-dump').textContent = 
                JSON.stringify(storage, null, 2);
        }
        
        // 页面加载时自动检查
        window.addEventListener('DOMContentLoaded', function() {
            dumpStorage();
            checkStorage();
        });
        
        // 监听storage变化
        window.addEventListener('storage', function(e) {
            console.log('Storage变化:', e.key, e.newValue);
            dumpStorage();
            checkStorage();
        });
    </script>
</body>
</html>
